<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFXIV 战术板编辑器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* 左侧工具栏 */
        .toolbar {
            width: 280px;
            background: #16213e;
            padding: 15px;
            overflow-y: auto;
            border-right: 2px solid #0f3460;
        }

        .toolbar h2 {
            color: #e94560;
            margin-bottom: 15px;
            font-size: 16px;
            border-bottom: 1px solid #0f3460;
            padding-bottom: 10px;
        }

        .toolbar-section {
            margin-bottom: 20px;
        }

        .toolbar-section h3 {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .object-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .object-item {
            width: 50px;
            height: 50px;
            background: #1a1a2e;
            border: 2px solid #0f3460;
            border-radius: 8px;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            user-select: none;
        }

        .object-item:hover {
            border-color: #e94560;
            transform: scale(1.1);
        }

        .object-item.selected {
            border-color: #e94560;
            background: #0f3460;
        }

        .object-item:active {
            cursor: grabbing;
        }

        .object-item img {
            max-width: 40px;
            max-height: 40px;
            pointer-events: none;
        }

        .special-btn {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            background: #0f3460;
            border: none;
            border-radius: 8px;
            color: #eee;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .special-btn:hover {
            background: #e94560;
        }

        .special-btn.active {
            background: #e94560;
        }

        /* 中间画布区域 */
        .canvas-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        .canvas-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .canvas-header h1 {
            color: #e94560;
            font-size: 20px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .header-buttons button {
            padding: 8px 16px;
            background: #0f3460;
            border: none;
            border-radius: 6px;
            color: #eee;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .header-buttons button:hover {
            background: #e94560;
        }

        .canvas-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d0d1a;
            border-radius: 10px;
            overflow: hidden;
        }

        #canvas {
            border: 2px solid #0f3460;
            cursor: crosshair;
        }

        /* 右侧属性面板 */
        .properties {
            width: 280px;
            background: #16213e;
            padding: 15px;
            overflow-y: auto;
            border-left: 2px solid #0f3460;
        }

        .properties h2 {
            color: #e94560;
            margin-bottom: 15px;
            font-size: 16px;
            border-bottom: 1px solid #0f3460;
            padding-bottom: 10px;
        }

        .prop-group {
            margin-bottom: 15px;
        }

        .prop-group label {
            display: block;
            color: #94a3b8;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .prop-group input, .prop-group select, .prop-group textarea {
            width: 100%;
            padding: 8px;
            background: #1a1a2e;
            border: 1px solid #0f3460;
            border-radius: 6px;
            color: #eee;
            font-size: 13px;
        }

        .prop-group input:focus, .prop-group select:focus {
            outline: none;
            border-color: #e94560;
        }

        .prop-row {
            display: flex;
            gap: 10px;
        }

        .prop-row .prop-group {
            flex: 1;
        }

        .color-picker {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .color-picker input[type="color"] {
            width: 50px;
            height: 35px;
            padding: 0;
            border: none;
            cursor: pointer;
        }

        .delete-btn {
            width: 100%;
            padding: 10px;
            background: #dc2626;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 14px;
            margin-top: 15px;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        /* 导入导出区域 */
        .io-section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #0f3460;
        }

        .io-section textarea {
            width: 100%;
            height: 80px;
            padding: 8px;
            background: #1a1a2e;
            border: 1px solid #0f3460;
            border-radius: 6px;
            color: #eee;
            font-size: 11px;
            resize: none;
            margin-bottom: 10px;
        }

        .io-buttons {
            display: flex;
            gap: 10px;
        }

        .io-buttons button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-import {
            background: #0f3460;
            color: #eee;
        }

        .btn-export {
            background: #e94560;
            color: white;
        }

        /* 背景选择 */
        .bg-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .bg-item {
            width: 50px;
            height: 38px;
            border: 2px solid #0f3460;
            border-radius: 6px;
            cursor: pointer;
            overflow: hidden;
        }

        .bg-item:hover, .bg-item.selected {
            border-color: #e94560;
        }

        .bg-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 提示信息 */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background: #0f3460;
            color: white;
            border-radius: 8px;
            display: none;
            z-index: 1000;
        }

        .toast.show {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* 对象列表 */
        .object-list {
            max-height: 150px;
            overflow-y: auto;
            margin-top: 10px;
        }

        .object-list-item {
            padding: 8px;
            background: #1a1a2e;
            border-radius: 6px;
            margin-bottom: 5px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .object-list-item:hover, .object-list-item.selected {
            background: #0f3460;
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }

        ::-webkit-scrollbar-thumb {
            background: #0f3460;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #e94560;
        }

        /* GitHub 链接 */
        .github-link {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: #0f3460;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            transition: all 0.3s;
            z-index: 100;
            text-decoration: none;
        }

        .github-link:hover {
            background: #e94560;
            color: white;
            transform: scale(1.1);
        }

        .github-link svg {
            width: 22px;
            height: 22px;
        }

        @media (max-width: 768px) {
            .github-link {
                bottom: 80px;
                right: 15px;
                width: 36px;
                height: 36px;
            }

            .github-link svg {
                width: 18px;
                height: 18px;
            }
        }

        /* ==================== 移动端导航 ==================== */
        .mobile-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #16213e;
            border-top: 2px solid #0f3460;
            z-index: 1000;
            padding: 8px 0;
        }

        .mobile-nav-buttons {
            display: flex;
            justify-content: space-around;
        }

        .mobile-nav-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 12px;
            padding: 8px 16px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .mobile-nav-btn.active {
            color: #e94560;
        }

        .mobile-nav-btn svg {
            width: 24px;
            height: 24px;
        }

        /* ==================== 响应式设计 ==================== */
        @media (max-width: 1024px) {
            .container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }

            .toolbar, .properties {
                width: 100%;
                max-width: 100%;
                border: none;
                border-bottom: 2px solid #0f3460;
            }

            .properties {
                border-bottom: none;
                border-top: 2px solid #0f3460;
                padding-bottom: 80px; /* 为底部导航留空间 */
            }

            .canvas-area {
                padding: 10px;
                min-height: 50vh;
            }

            .canvas-wrapper {
                overflow: auto;
            }

            #canvas {
                max-width: 100%;
                height: auto;
            }
        }

        @media (max-width: 768px) {
            .mobile-nav {
                display: block;
            }

            .container {
                padding-bottom: 70px;
            }

            /* 默认隐藏工具栏和属性面板 */
            .toolbar, .properties {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 70px;
                z-index: 999;
                overflow-y: auto;
                border: none;
            }

            .toolbar.mobile-visible,
            .properties.mobile-visible {
                display: block;
            }

            /* 画布区域始终显示 */
            .canvas-area {
                display: flex;
                padding: 8px;
            }

            .canvas-area.mobile-hidden {
                display: none;
            }

            .canvas-header {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }

            .canvas-header h1 {
                font-size: 16px;
            }

            .header-buttons {
                width: 100%;
            }

            .header-buttons button {
                flex: 1;
                padding: 10px 8px;
                font-size: 12px;
            }

            /* 工具栏网格调整 */
            .object-grid {
                grid-template-columns: repeat(6, 1fr);
            }

            .bg-grid {
                grid-template-columns: repeat(6, 1fr);
            }

            /* 属性面板调整 */
            .prop-row {
                flex-direction: row;
            }

            .io-section textarea {
                height: 60px;
                font-size: 10px;
            }

            /* 对象列表 */
            .object-list {
                max-height: 120px;
            }

            /* 特殊按钮两列排列 */
            .toolbar-section .special-btn {
                display: inline-block;
                width: calc(50% - 4px);
                margin-right: 4px;
                margin-bottom: 8px;
                padding: 12px 8px;
                font-size: 13px;
            }

            .toolbar-section .special-btn:nth-child(2n) {
                margin-right: 0;
            }
        }

        @media (max-width: 480px) {
            .object-grid {
                grid-template-columns: repeat(5, 1fr);
            }

            .bg-grid {
                grid-template-columns: repeat(5, 1fr);
            }

            .object-item {
                width: 45px;
                height: 45px;
            }

            .object-item img {
                max-width: 35px;
                max-height: 35px;
            }

            .bg-item {
                width: 45px;
                height: 34px;
            }

            .toolbar h2, .properties h2 {
                font-size: 14px;
            }

            .toolbar-section h3 {
                font-size: 12px;
            }

            .prop-group label {
                font-size: 11px;
            }

            .prop-group input, .prop-group select {
                padding: 6px;
                font-size: 12px;
            }
        }

        /* 横屏模式优化 */
        @media (max-width: 768px) and (orientation: landscape) {
            .toolbar.mobile-visible,
            .properties.mobile-visible {
                display: flex;
                flex-direction: row;
                flex-wrap: wrap;
                align-content: flex-start;
            }

            .toolbar.mobile-visible .toolbar-section,
            .properties.mobile-visible .prop-group,
            .properties.mobile-visible .toolbar-section {
                width: 50%;
                padding: 0 10px;
            }

            .properties.mobile-visible .io-section {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左侧工具栏 -->
        <div class="toolbar">
            <h2>工具箱</h2>

            <!-- 特殊对象 -->
            <div class="toolbar-section">
                <h3>特殊对象</h3>
                <button class="special-btn" data-tool="select">选择工具</button>
                <button class="special-btn" data-tool="circle">圆形 AOE</button>
                <button class="special-btn" data-tool="fan">扇形 AOE</button>
                <button class="special-btn" data-tool="donut">圆环 AOE</button>
                <button class="special-btn" data-tool="rect">矩形 AOE</button>
                <button class="special-btn" data-tool="line">线条</button>
                <button class="special-btn" data-tool="text">文本</button>
            </div>

            <!-- 背景选择 -->
            <div class="toolbar-section">
                <h3>背景</h3>
                <div class="bg-grid" id="bgGrid"></div>
            </div>

            <!-- 图标对象 -->
            <div class="toolbar-section">
                <h3>图标</h3>
                <div class="object-grid" id="objectGrid"></div>
            </div>
        </div>

        <!-- 中间画布 -->
        <div class="canvas-area">
            <div class="canvas-header">
                <h1>FFXIV 战术板编辑器</h1>
                <div class="header-buttons">
                    <button onclick="clearCanvas()">清空画布</button>
                    <button onclick="undoLast()">撤销</button>
                </div>
            </div>
            <div class="canvas-wrapper">
                <canvas id="canvas" width="1024" height="768"></canvas>
            </div>
        </div>

        <!-- 右侧属性面板 -->
        <div class="properties">
            <h2>属性</h2>

            <!-- 战术板名称 -->
            <div class="prop-group">
                <label>战术板名称</label>
                <input type="text" id="boardName" value="我的战术板" placeholder="输入名称">
            </div>

            <!-- 选中对象属性 -->
            <div id="objectProps" style="display: none;">
                <div class="prop-row">
                    <div class="prop-group">
                        <label>X 坐标</label>
                        <input type="number" id="propX" min="0" max="1024">
                    </div>
                    <div class="prop-group">
                        <label>Y 坐标</label>
                        <input type="number" id="propY" min="0" max="768">
                    </div>
                </div>

                <div class="prop-row">
                    <div class="prop-group">
                        <label>缩放</label>
                        <input type="number" id="propScale" min="1" max="255" value="100">
                    </div>
                    <div class="prop-group">
                        <label>旋转 (度)</label>
                        <input type="number" id="propAngle" min="-180" max="180" value="0">
                    </div>
                </div>

                <div class="prop-group">
                    <label>颜色</label>
                    <div class="color-picker">
                        <input type="color" id="propColor" value="#ff9000">
                        <input type="range" id="propAlpha" min="0" max="100" value="75" style="flex:1">
                        <span id="alphaValue">75%</span>
                    </div>
                </div>

                <!-- AOE 专用参数 -->
                <div id="aoeParams" style="display: none;">
                    <div class="prop-row">
                        <div class="prop-group">
                            <label>角度/宽度</label>
                            <input type="number" id="propParam1" min="0" value="360">
                        </div>
                        <div class="prop-group">
                            <label>内半径/高度</label>
                            <input type="number" id="propParam2" min="0" value="0">
                        </div>
                    </div>
                </div>

                <!-- 文本专用 -->
                <div id="textParams" style="display: none;">
                    <div class="prop-group">
                        <label>文本内容</label>
                        <input type="text" id="propText" placeholder="输入文本">
                    </div>
                </div>

                <button class="delete-btn" onclick="deleteSelected()">删除选中对象</button>
            </div>

            <!-- 对象列表 -->
            <div class="toolbar-section" style="margin-top: 20px;">
                <h3>对象列表 (<span id="objectCount">0</span>)</h3>
                <div class="object-list" id="objectList"></div>
            </div>

            <!-- 导入导出 -->
            <div class="io-section">
                <h3 style="color: #94a3b8; font-size: 13px; margin-bottom: 10px;">导入/导出</h3>
                <textarea id="shareString" placeholder="粘贴分享字符串导入，或点击导出生成..."></textarea>
                <div class="io-buttons">
                    <button class="btn-import" onclick="importBoard()">导入</button>
                    <button class="btn-export" onclick="exportBoard()">导出</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- 底部 GitHub 链接 -->
    <a href="https://github.com/Cindy-Master/ff14-online-strategy-board" target="_blank" class="github-link" title="GitHub">
        <svg viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
    </a>

    <!-- 移动端底部导航 -->
    <nav class="mobile-nav">
        <div class="mobile-nav-buttons">
            <button class="mobile-nav-btn" data-panel="toolbar" onclick="showMobilePanel('toolbar')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                </svg>
                工具
            </button>
            <button class="mobile-nav-btn active" data-panel="canvas" onclick="showMobilePanel('canvas')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <path d="M21 15l-5-5L5 21"></path>
                </svg>
                画布
            </button>
            <button class="mobile-nav-btn" data-panel="properties" onclick="showMobilePanel('properties')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
                属性
            </button>
        </div>
    </nav>

    <script>
        // ==================== API 配置 ====================
        const STATIC_BASE = 'https://board.ff14.xin/static/board';  // 静态资源服务器
        const API_BASE = 'https://board.ff14.xin/api';  // 编解码 API

        // ==================== 缓存管理 ====================
        const CACHE_NAME = 'ffxiv-strategy-board-v1';
        const CACHE_DURATION = 7 * 24 * 60 * 60 * 1000; // 7天缓存

        // 带缓存的 fetch
        async function cachedFetch(url) {
            const cacheKey = `cache_${url}`;
            const cacheTimeKey = `cache_time_${url}`;

            // 检查 localStorage 缓存
            const cachedData = localStorage.getItem(cacheKey);
            const cachedTime = localStorage.getItem(cacheTimeKey);

            if (cachedData && cachedTime) {
                const age = Date.now() - parseInt(cachedTime);
                if (age < CACHE_DURATION) {
                    return JSON.parse(cachedData);
                }
            }

            // 请求新数据
            const resp = await fetch(url);
            const data = await resp.json();

            // 存入缓存
            try {
                localStorage.setItem(cacheKey, JSON.stringify(data));
                localStorage.setItem(cacheTimeKey, Date.now().toString());
            } catch (e) {
                console.warn('缓存写入失败:', e);
            }

            return data;
        }

        function onMouseDown(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (state.currentTool === 'select') {
                // 先检查是否点击了手柄
                if (state.selectedObject) {

                    if (handle) {

                            state.isRotating = true;

                            state.rotateStart = Math.atan2(y - state.selectedObject.y, x - state.selectedObject.x);
                        } else {

                            state.resizeHandle = handle;
                            state.originalScale = state.selectedObject.scale;
                            state.dragOffset = { x, y };
                        }
                        return;
                    }
                }

                // 选择模式：检查是否点击了对象
                const clicked = findObjectAt(x, y);
                if (clicked) {

        // 获取点击的手柄类型
        function getHandleAt(x, y, obj) {
            const size = getObjectSize(obj);
            const halfSize = size / 2;

            // 旋转手柄位置（在对象上方）
            const rotateX = obj.x;
            const rotateY = obj.y - halfSize - ROTATION_HANDLE_DISTANCE;
            if (Math.abs(x - rotateX) <= HANDLE_SIZE && Math.abs(y - rotateY) <= HANDLE_SIZE) {
                return 'rotate';
            }

            // 四角手柄
            const corners = {
                'nw': { x: obj.x - halfSize, y: obj.y - halfSize },
                'ne': { x: obj.x + halfSize, y: obj.y - halfSize },
                'sw': { x: obj.x - halfSize, y: obj.y + halfSize },
                'se': { x: obj.x + halfSize, y: obj.y + halfSize }
            };

            for (const [name, pos] of Object.entries(corners)) {
                if (Math.abs(x - pos.x) <= HANDLE_SIZE && Math.abs(y - pos.y) <= HANDLE_SIZE) {
                    return name;
                }
            }

            return null;
        }

        function onMouseMove(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // 旋转操作
            if (state.isRotating && state.selectedObject) {
                const currentAngle = Math.atan2(y - state.selectedObject.y, x - state.selectedObject.x);
                const deltaAngle = currentAngle - state.rotateStart;
                state.selectedObject.angle = state.originalAngle + deltaAngle;
                updatePropsPanel();
                render();
                return;
            }

            // 缩放操作
            if (state.isResizing && state.selectedObject) {
                const obj = state.selectedObject;
                const dx = x - state.dragOffset.x;
                const dy = y - state.dragOffset.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const sign = (dx + dy) > 0 ? 1 : -1;

                // 根据拖动距离调整缩放
                const scaleDelta = sign * distance * 0.5;
                obj.scale = Math.max(5, Math.min(255, state.originalScale + scaleDelta));
                updatePropsPanel();
                render();
                return;
            }

            // 拖动对象
            if (state.isDragging && state.selectedObject) {
                state.selectedObject.x = Math.round(x - state.dragOffset.x);
                state.selectedObject.y = Math.round(y - state.dragOffset.y);
                updatePropsPanel();
                render();
                return;
            }

            // 绘制预览
            if (state.isDrawing && state.drawStart) {
                render();
                // 预览绘制
                drawPreview(state.drawStart.x, state.drawStart.y, x, y);
                return;
            }

            // 更新鼠标样式
            if (state.currentTool === 'select' && state.selectedObject) {
                const handle = getHandleAt(x, y, state.selectedObject);
                if (handle === 'rotate') {
                    canvas.style.cursor = 'crosshair';
                } else if (handle === 'nw' || handle === 'se') {
                    canvas.style.cursor = 'nwse-resize';
                } else if (handle === 'ne' || handle === 'sw') {
                    canvas.style.cursor = 'nesw-resize';
                } else if (findObjectAt(x, y) === state.selectedObject) {
                    canvas.style.cursor = 'move';
                } else {
                    canvas.style.cursor = 'default';
                }
            } else if (state.currentTool === 'select') {
                canvas.style.cursor = findObjectAt(x, y) ? 'pointer' : 'default';
            } else {
                canvas.style.cursor = 'crosshair';
            }
        }

            const rect = canvas.getBoundingClientRect();

            const y = e.clientY - rect.top;

                finishDrawing(state.drawStart.x, state.drawStart.y, x, y);

            state.isDragging = false;
            state.isDrawing = false;

        // ==================== 触摸事件处理 ====================
        function getTouchPos(e) {
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0] || e.changedTouches[0];
            // 考虑缩放
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (touch.clientX - rect.left) * scaleX,
                y: (touch.clientY - rect.top) * scaleY
            };

                render();
                return;
            }

            if (state.isDrawing && state.drawStart) {
                render();
                drawPreview(state.drawStart.x, state.drawStart.y, x, y);
                return;
            }
        }

        function onTouchEnd(e) {
            e.preventDefault();
            const pos = getTouchPos(e);
            const x = pos.x;
            const y = pos.y;

            if (state.isDrawing && state.drawStart) {
                finishDrawing(state.drawStart.x, state.drawStart.y, x, y);
            }

            state.isDragging = false;
            state.isDrawing = false;
            state.drawStart = null;
            state.isResizing = false;
            state.resizeHandle = null;
            state.isRotating = false;
        }

        // ==================== 绘制相关 ====================
        function drawPreview(x1, y1, x2, y2) {
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 144, 0, 0.8)';
            ctx.fillStyle = 'rgba(255, 144, 0, 0.3)';
            ctx.lineWidth = 2;

            if (state.currentTool === 'circle') {
                // 完整圆形AOE
                const radius = Math.sqrt((x2-x1)**2 + (y2-y1)**2);
                ctx.beginPath();
                ctx.arc(x1, y1, radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            } else if (state.currentTool === 'fan') {
                // 扇形AOE预览 - 默认90度扇形，从12点钟方向开始
                const radius = Math.sqrt((x2-x1)**2 + (y2-y1)**2);
                const direction = Math.atan2(y2 - y1, x2 - x1) + Math.PI / 2;
                const arcAngle = Math.PI / 2;  // 90度
                ctx.translate(x1, y1);
                ctx.rotate(direction);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, -Math.PI/2, -Math.PI/2 + arcAngle);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.setTransform(1, 0, 0, 1, 0, 0);  // 重置变换
            } else if (state.currentTool === 'donut') {
                // 圆环AOE预览 - 内半径为外半径的一半
                const radius = Math.sqrt((x2-x1)**2 + (y2-y1)**2);
                const innerRadius = radius / 2;
                ctx.beginPath();
                ctx.arc(x1, y1, radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                // 内圆镂空
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(x1, y1, innerRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalCompositeOperation = 'source-over';
            } else if (state.currentTool === 'rect') {
                const w = Math.abs(x2 - x1);
                const h = Math.abs(y2 - y1);
                ctx.fillRect(x1 - w, y1 - h/2, w*2, h);
                ctx.strokeRect(x1 - w, y1 - h/2, w*2, h);
            } else if (state.currentTool === 'line') {
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function finishDrawing(x1, y1, x2, y2) {
            const dx = x2 - x1;
            const dy = y2 - y1;

            if (state.currentTool === 'circle') {
                // 完整圆形AOE - id=9, 缩放因子 1/100
                // 显示半径 = img.width * (scale/100) / 2 = 512 * scale / 200 = scale * 2.56
                // 所以 scale = radius / 2.56
                const radius = Math.sqrt(dx*dx + dy*dy);
                addObject({
                    id: 9,
                    x: Math.round(x1),
                    y: Math.round(y1),
                    scale: Math.max(1, Math.min(255, Math.round(radius / 2.56))),
                    angle: 0,
                    red: 255, green: 144, blue: 0,
                    alpha: 0.75,
                    param1: 0,
                    param2: 0,
                    param3: 0
                });
            } else if (state.currentTool === 'fan') {
                // 扇形AOE - id=10
                // 半径 = 256 * (scale / 50), 所以 scale = radius * 50 / 256
                const radius = Math.sqrt(dx*dx + dy*dy);
                const angle = Math.atan2(dy, dx) + Math.PI / 2;  // 调整角度使扇形指向鼠标方向
                addObject({
                    id: 10,
                    x: Math.round(x1),
                    y: Math.round(y1),
                    scale: Math.round(radius * 50 / 256),
                    angle: angle,
                    red: 255, green: 144, blue: 0,
                    alpha: 0.75,
                    param1: 90,   // 默认90度扇形
                    param2: 0,
                    param3: 0
                });
            } else if (state.currentTool === 'donut') {
                // 圆环AOE - id=17
                // 半径 = 250 * (scale / 50), 所以 scale = radius * 50 / 250
                // param2 是在 outerRadius=250 坐标系下的内半径值
                const radius = Math.sqrt(dx*dx + dy*dy);
                addObject({
                    id: 17,
                    x: Math.round(x1),
                    y: Math.round(y1),
                    scale: Math.round(radius * 50 / 250),
                    angle: 0,
                    red: 255, green: 144, blue: 0,
                    alpha: 0.75,
                    param1: 360,
                    param2: 125,  // 内半径 = 外半径的一半 (250 / 2)
                    param3: 0
                });
            } else if (state.currentTool === 'rect') {
                const w = Math.abs(dx);
                const h = Math.abs(dy);
                addObject({
                    id: 11,
                    x: Math.round(x1),
                    y: Math.round(y1),
                    scale: 100,
                    angle: Math.atan2(dy, dx),
                    red: 255, green: 144, blue: 0,
                    alpha: 0.75,
                    param1: Math.round(w),
                    param2: Math.round(h),
                    param3: 0
                });
            } else if (state.currentTool === 'line') {
                addObject({
                    id: 12,
                    x: Math.round(x1),
                    y: Math.round(y1),
                    scale: 100,
                    angle: 0,
                    red: 255, green: 255, blue: 255,
                    alpha: 1.0,
                    param1: Math.round(x2 / 1024 * 5120),
                    param2: Math.round(y2 / 768 * 3840),
                    param3: 2
                });
            }
        }

        // ==================== 对象管理 ====================
        function addObject(obj) {
            obj.visible = true;
            obj.flip_horizontal = false;
            obj.flip_vertical = false;
            obj.locked = false;
            if (!obj.string) obj.string = '';
            if (!obj.param1) obj.param1 = 0;
            if (!obj.param2) obj.param2 = 0;
            if (!obj.param3) obj.param3 = 0;

            state.objects.push(obj);
            updateObjectList();
            selectObject(obj);
            render();
            showToast('已添加对象');
        }

        function findObjectAt(x, y) {
            // 从后往前查找（后添加的在上层）
            for (let i = state.objects.length - 1; i >= 0; i--) {
                const obj = state.objects[i];
                const size = getObjectSize(obj);
                if (x >= obj.x - size/2 && x <= obj.x + size/2 &&
                    y >= obj.y - size/2 && y <= obj.y + size/2) {
                    return obj;
                }
            }
            return null;
        }

        function getObjectSize(obj) {
            if (obj.id === 9) {
                // CircleAoE: scale / 100 * imageSize (约512)
                return obj.scale * 5.12;
            }
            if (obj.id === 10 || obj.id === 17) {
                // FanAoE/Donut: outerRadius(256/250) * 2 * (scale / 50)
                return 256 * 2 * (obj.scale / 50);
            }
            if (obj.id === 11) return Math.max(obj.param1, obj.param2) * 2;
            if (obj.id === 100) return 60;  // 文本 30px 字体
            const factor = state.scaleFactor[obj.id] || (1/200);
            return obj.scale * factor * 200;
        }

        function selectObject(obj) {
            state.selectedObject = obj;
            document.getElementById('objectProps').style.display = 'block';
            updatePropsPanel();
            updateObjectList();
            render();
        }

        function deselectObject() {
            state.selectedObject = null;
            document.getElementById('objectProps').style.display = 'none';
            updateObjectList();
            render();
        }

        function deleteSelected() {
            if (state.selectedObject) {
                saveHistory();
                const idx = state.objects.indexOf(state.selectedObject);
                if (idx > -1) {
                    state.objects.splice(idx, 1);
                }
                deselectObject();
                updateObjectList();
                render();
                showToast('已删除对象');
            }
        }

        // ==================== 属性面板 ====================
        function updatePropsPanel() {
            const obj = state.selectedObject;
            if (!obj) return;

            document.getElementById('propX').value = obj.x;
            document.getElementById('propY').value = obj.y;
            document.getElementById('propScale').value = obj.scale;
            document.getElementById('propAngle').value = Math.round(obj.angle * 180 / Math.PI);

            const color = '#' + [obj.red, obj.green, obj.blue].map(c =>
                c.toString(16).padStart(2, '0')
            ).join('');
            document.getElementById('propColor').value = color;
            document.getElementById('propAlpha').value = Math.round(obj.alpha * 100);
            document.getElementById('alphaValue').textContent = Math.round(obj.alpha * 100) + '%';

            // AOE 参数
            const aoeParams = document.getElementById('aoeParams');
            const textParams = document.getElementById('textParams');

            if ([9, 10, 11, 17].includes(obj.id)) {
                aoeParams.style.display = 'block';
                textParams.style.display = 'none';
                document.getElementById('propParam1').value = obj.param1;
                document.getElementById('propParam2').value = obj.param2;
            } else if (obj.id === 100) {
                aoeParams.style.display = 'none';
                textParams.style.display = 'block';
                document.getElementById('propText').value = obj.string || '';
            } else {
                aoeParams.style.display = 'none';
                textParams.style.display = 'none';
            }
        }

        function updateSelectedFromProps() {
            const obj = state.selectedObject;
            if (!obj) return;

            obj.x = parseInt(document.getElementById('propX').value) || 0;
            obj.y = parseInt(document.getElementById('propY').value) || 0;
            obj.scale = parseInt(document.getElementById('propScale').value) || 100;
            obj.angle = (parseInt(document.getElementById('propAngle').value) || 0) * Math.PI / 180;

            const color = document.getElementById('propColor').value;
            obj.red = parseInt(color.substr(1, 2), 16);
            obj.green = parseInt(color.substr(3, 2), 16);
            obj.blue = parseInt(color.substr(5, 2), 16);
            obj.alpha = parseInt(document.getElementById('propAlpha').value) / 100;

            if ([9, 10, 11, 17].includes(obj.id)) {
                obj.param1 = parseInt(document.getElementById('propParam1').value) || 0;
                obj.param2 = parseInt(document.getElementById('propParam2').value) || 0;
            }

            if (obj.id === 100) {
                obj.string = document.getElementById('propText').value;
            }

            render();
        }

        // ==================== 对象列表 ====================
        function updateObjectList() {
            const list = document.getElementById('objectList');
            document.getElementById('objectCount').textContent = state.objects.length;

            list.innerHTML = '';
            state.objects.forEach((obj, idx) => {
                const div = document.createElement('div');
                div.className = 'object-list-item' + (obj === state.selectedObject ? ' selected' : '');

                let name = `#${idx + 1} `;
                if (obj.id === 9) name += '圆形AOE';
                else if (obj.id === 10) name += '扇形AOE';
                else if (obj.id === 11) name += '矩形AOE';
                else if (obj.id === 12) name += '线条';
                else if (obj.id === 17) name += '圆环AOE';
                else if (obj.id === 100) name += `文本: ${obj.string || ''}`;
                else name += `图标 ${obj.id}`;

                div.textContent = name;
                div.onclick = () => selectObject(obj);
                list.appendChild(div);
            });
        }

        // ==================== 渲染 ====================
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 绘制背景
            if (backgroundImage) {
                ctx.drawImage(backgroundImage, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#333';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // 绘制所有对象
            state.objects.forEach(obj => {
                if (!obj.visible) return;
                drawObject(obj);
            });

            // 绘制选中框和手柄
            if (state.selectedObject) {
                const obj = state.selectedObject;
                const size = getObjectSize(obj);
                const halfSize = size / 2;

                // 绘制选中框
                ctx.strokeStyle = '#e94560';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.strokeRect(obj.x - halfSize - 5, obj.y - halfSize - 5, size + 10, size + 10);
                ctx.setLineDash([]);

                // 绘制四角缩放手柄
                ctx.fillStyle = '#e94560';
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;

                const corners = [
                    { x: obj.x - halfSize, y: obj.y - halfSize },  // nw
                    { x: obj.x + halfSize, y: obj.y - halfSize },  // ne
                    { x: obj.x - halfSize, y: obj.y + halfSize },  // sw
                    { x: obj.x + halfSize, y: obj.y + halfSize }   // se
                ];

                corners.forEach(corner => {
                    ctx.fillRect(corner.x - HANDLE_SIZE/2, corner.y - HANDLE_SIZE/2, HANDLE_SIZE, HANDLE_SIZE);
                    ctx.strokeRect(corner.x - HANDLE_SIZE/2, corner.y - HANDLE_SIZE/2, HANDLE_SIZE, HANDLE_SIZE);
                });

                // 绘制旋转手柄连接线
                ctx.strokeStyle = '#e94560';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(obj.x, obj.y - halfSize - 5);
                ctx.lineTo(obj.x, obj.y - halfSize - ROTATION_HANDLE_DISTANCE);
                ctx.stroke();

                // 绘制旋转手柄（圆形）
                ctx.fillStyle = '#22c55e';
                ctx.strokeStyle = '#fff';
                ctx.beginPath();
                ctx.arc(obj.x, obj.y - halfSize - ROTATION_HANDLE_DISTANCE, HANDLE_SIZE/2 + 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }
        }

        // 创建环形扇区 (与参考库 makeAnnulusSector 同步)
        // image 参数：如果传入图片则用图片纹理，否则用颜色填充
        function makeAnnulusSector(innerRadius, outerRadius, arcAngle, colorOrImage = 'rgba(255, 144, 0, 0.75)') {
            const x = outerRadius;
            const y = outerRadius;
            const startAngle = -Math.PI / 2;
            const endAngle = startAngle + arcAngle;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = outerRadius * 2;
            tempCanvas.height = outerRadius * 2;
            const tempCtx = tempCanvas.getContext('2d');

            // 绘制环形扇区路径
            tempCtx.beginPath();
            // 外弧
            tempCtx.arc(x, y, outerRadius, startAngle, endAngle, false);
            // 连接到内弧
            tempCtx.lineTo(x + innerRadius * Math.cos(endAngle), y + innerRadius * Math.sin(endAngle));
            // 内弧 (反向)
            if (innerRadius > 0) {
                tempCtx.arc(x, y, innerRadius, endAngle, startAngle, true);
            }
            // 连接回起点
            tempCtx.lineTo(x + outerRadius * Math.cos(startAngle), y + outerRadius * Math.sin(startAngle));
            tempCtx.closePath();

            // 判断是图片还是颜色
            if (colorOrImage instanceof HTMLImageElement) {
                // 使用图片纹理 - 裁剪后绘制
                tempCtx.clip();
                tempCtx.drawImage(colorOrImage, 0, 0, outerRadius * 2, outerRadius * 2);
            } else {
                // 填充颜色
                tempCtx.fillStyle = colorOrImage;
                tempCtx.fill();
            }

            // 裁剪边缘以匹配游戏内效果
            let leftEdge = 0, rightEdge = 0, bottomEdge = 0;

            if (arcAngle < Math.PI * 1.5 && arcAngle >= Math.PI) {
                leftEdge = (1 + Math.sin(arcAngle)) * outerRadius;
            } else if (arcAngle < Math.PI) {
                leftEdge = outerRadius;
            }

            if (arcAngle < Math.PI) {
                if (arcAngle >= Math.PI * 0.5) {
                    bottomEdge = (1 + Math.cos(arcAngle)) * outerRadius;
                } else {
                    bottomEdge = outerRadius + Math.cos(arcAngle) * (innerRadius || 0);
                }
            }

            if (arcAngle < Math.PI * 0.5) {
                rightEdge = (1 - Math.sin(arcAngle)) * outerRadius;
            }

            const croppedCanvas = document.createElement('canvas');
            croppedCanvas.width = outerRadius * 2 - leftEdge - rightEdge;
            croppedCanvas.height = outerRadius * 2 - bottomEdge;
            const croppedCtx = croppedCanvas.getContext('2d');
            croppedCtx.drawImage(tempCanvas, -leftEdge, 0);

            return croppedCanvas;
        }

        function drawObject(obj) {
            ctx.save();

            const alpha = obj.alpha;
            const color = `rgba(${obj.red}, ${obj.green}, ${obj.blue}, ${alpha})`;

            // 处理翻转
            const flipH = obj.flip_horizontal ? -1 : 1;
            const flipV = obj.flip_vertical ? -1 : 1;

            if (obj.id === 9) {
                // 圆形AOE (完整圆) - CircleAoE, 缩放因子 1/100
                const img = objectImages[9];
                if (img) {
                    const scale = obj.scale / 100;
                    const w = img.width * scale;
                    const h = img.height * scale;
                    ctx.translate(obj.x, obj.y);
                    ctx.rotate(obj.angle);
                    ctx.scale(flipH, flipV);
                    ctx.globalAlpha = alpha;
                    ctx.drawImage(img, -w/2, -h/2, w, h);
                } else {
                    // 如果没有图片，用纯色圆形
                    const radius = obj.scale * 5.12;
                    ctx.translate(obj.x, obj.y);
                    ctx.rotate(obj.angle);
                    ctx.beginPath();
                    ctx.arc(0, 0, radius, 0, Math.PI * 2);
                    ctx.fillStyle = color;
                    ctx.fill();
                }
            } else if (obj.id === 10) {
                // 扇形AOE - FanAoE
                // outerRadius = 256, 缩放 = scale / 50
                // 使用 circle_aoe 图片 (objectImages[9]) 作为纹理
                const outerRadius = 256;
                const innerRadius = 0;
                const arcAngle = (obj.param1 / 180) * Math.PI;
                const scale = obj.scale / 50;

                // 使用 objectImages[9] (circle_aoe) 作为纹理图片
                const circleAoeImg = objectImages[9];
                const sectorCanvas = makeAnnulusSector(innerRadius, outerRadius, arcAngle, circleAoeImg || color);

                ctx.translate(obj.x, obj.y);
                ctx.rotate(obj.angle);
                ctx.scale(scale * flipH, scale * flipV);
                ctx.drawImage(sectorCanvas, -sectorCanvas.width / 2, -sectorCanvas.height / 2);
            } else if (obj.id === 17) {
                // 圆环AOE - Donut
                // outerRadius = 250, innerRadius = param2, 缩放 = scale / 50
                // 游戏内分享的环形AOE颜色通常是白色，需要使用默认橙色
                const outerRadius = 250;
                const innerRadius = obj.param2;
                const arcAngle = (obj.param1 / 180) * Math.PI;
                const scale = obj.scale / 50;

                // 如果颜色是白色(255,255,255)，使用默认橙色
                const isWhite = obj.red === 255 && obj.green === 255 && obj.blue === 255;
                const donutColor = isWhite ? 'rgba(255, 144, 0, 0.75)' : color;
                const sectorCanvas = makeAnnulusSector(innerRadius, outerRadius, arcAngle, donutColor);

                ctx.translate(obj.x, obj.y);
                ctx.rotate(obj.angle);
                ctx.scale(scale * flipH, scale * flipV);
                ctx.drawImage(sectorCanvas, -sectorCanvas.width / 2, -sectorCanvas.height / 2);
            } else if (obj.id === 11) {
                // 矩形 AOE - LineAoE
                const w = obj.param1 * 2;
                const h = obj.param2 * 2;

                ctx.translate(obj.x, obj.y);
                ctx.rotate(obj.angle);
                ctx.scale(flipH, flipV);

                ctx.fillStyle = color;
                ctx.fillRect(-w/2, -h/2, w, h);
            } else if (obj.id === 12) {
                // 线条 - Line
                const x2 = Math.round(obj.param1 / 5120 * 1024);
                const y2 = Math.round(obj.param2 / 3840 * 768);

                ctx.lineCap = 'round';
                ctx.lineWidth = obj.param3 * 2 || 2;
                ctx.strokeStyle = color;
                ctx.beginPath();
                ctx.moveTo(obj.x, obj.y);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            } else if (obj.id === 100) {
                // 文本 - Text (与参考库同步: 30px, 有描边和阴影)
                ctx.font = '30px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.lineWidth = 1.5;
                ctx.shadowBlur = 3;
                ctx.shadowColor = 'black';
                ctx.fillStyle = `rgb(${obj.red} ${obj.green} ${obj.blue})`;
                ctx.strokeStyle = 'rgb(0 0 0)';

                ctx.strokeText(obj.string || '', obj.x, obj.y);
                ctx.fillText(obj.string || '', obj.x, obj.y);
            } else {
                // 图标 - 使用图片
                const img = objectImages[obj.id];
                if (img) {
                    const factor = state.scaleFactor[obj.id] || (1/200);
                    const scale = obj.scale * factor;
                    const w = img.width * scale;
                    const h = img.height * scale;

                    ctx.translate(obj.x, obj.y);
                    ctx.rotate(obj.angle);
                    ctx.scale(flipH, flipV);
                    ctx.globalAlpha = alpha;
                    ctx.drawImage(img, -w/2, -h/2, w, h);
                }
            }

            ctx.restore();
        }

        // ==================== 导入导出 ====================
        async function importBoard() {
            const shareString = document.getElementById('shareString').value.trim();
            if (!shareString) {
                showToast('请输入分享字符串');
                return;
            }

            try {
                const resp = await fetch(API_BASE + '/decode', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ share_string: shareString })
                });

                const data = await resp.json();
                if (data.error) {
                    showToast('导入失败: ' + data.error);
                    return;
                }

                // 应用数据
                saveHistory();
                document.getElementById('boardName').value = data.board_name;
                state.background = data.background;
                state.objects = data.objects;
                state.selectedObject = null;

                loadBackground(state.background);
                updateObjectList();
                render();

                showToast('导入成功！共 ' + data.objects.length + ' 个对象');
            } catch (e) {
                showToast('导入失败: ' + e.message);
            }
        }

        async function exportBoard() {
            const boardData = {
                board_name: document.getElementById('boardName').value || '未命名',
                background: state.background,
                objects: state.objects
            };

            try {
                const resp = await fetch(API_BASE + '/encode', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(boardData)
                });

                const data = await resp.json();
                if (data.error) {
                    showToast('导出失败: ' + data.error);
                    return;
                }

                document.getElementById('shareString').value = data.share_string;

                // 复制到剪贴板
                navigator.clipboard.writeText(data.share_string).then(() => {
                    showToast('已导出并复制到剪贴板！');
                }).catch(() => {
                    showToast('已导出！请手动复制');
                });
            } catch (e) {
                showToast('导出失败: ' + e.message);
            }
        }

        // ==================== 工具函数 ====================
        function clearCanvas() {
            if (confirm('确定要清空画布吗？')) {
                saveHistory();
                state.objects = [];
                state.selectedObject = null;
                updateObjectList();
                render();
                showToast('画布已清空');
            }
        }

        function saveHistory() {
            state.history.push(JSON.stringify(state.objects));
            if (state.history.length > 50) state.history.shift();
        }

        function undoLast() {
            if (state.history.length > 0) {
                state.objects = JSON.parse(state.history.pop());
                state.selectedObject = null;
                updateObjectList();
                render();
                showToast('已撤销');
            } else {
                showToast('没有可撤销的操作');
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // ==================== 启动 ====================
        init();
    </script>
</body>
</html>
